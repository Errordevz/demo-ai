name: Build cloud model artifact

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: demo-ai-cloud-artifact
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.8.0+cpu numpy==2.2.5 sentencepiece==0.2.0
      - name: Build and quantize model
        run: python scripts/build_cloud_model.py
      - name: Publish cloud runtime release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cloud-latest
          name: Demo AI cloud runtime
          prerelease: true
          make_latest: false
          files: build/demo-ai-cloud-runtime.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
